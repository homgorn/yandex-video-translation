name: Deploy Yandex Video Translation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install httpx protobuf pydantic fastapi uvicorn
      - name: Run video translation test
        run: |
          python test_video.py "https://www.youtube.com/watch?v=jNQXAC9IVRw"
        env:
          HTTPS_PROXY: ""
          HTTP_PROXY: ""
      - name: Build Docker image
        run: docker build -t yandex-video-translation .
